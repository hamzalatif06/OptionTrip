name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.23.237.250
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            echo '📥 Syncing to origin/main (force-push safe)...'
            cd ~/OptionTrip
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

            echo '🔎 Integrity check...'
            if grep -qE "createRequire|_0x[0-9a-f]{4,}\(" Frontend/vite.config.js; then
              echo '❌ ABORT: vite.config.js contains injected code. Not building.'
              exit 1
            fi

            echo '🚀 Deploying Backend...'
            cd ~/OptionTrip/Backend
            npm install
            pm2 restart optiontrip-backend --update-env

            echo '🎨 Building Frontend...'
            cd ~/OptionTrip/Frontend
            npm install
            npm run build
            test -f dist/index.html

            echo '📦 Publishing build...'
            rm -rf /var/www/optiontrip/*
            cp -r dist/* /var/www/optiontrip/
            chown -R www-data:www-data /var/www/optiontrip
            chmod -R 755 /var/www/optiontrip

            echo '✅ Deployment complete!'
            pm2 status
